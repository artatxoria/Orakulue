[project]
name = "orakulue"
version = "2.0.0a1"
description = "Inventario, deduplicación y consulta con IA de un fondo documental para formación"
readme = "README.md"
requires-python = ">=3.11"
# Las fases 1 a 3 solo usan la biblioteca estándar; la 4 añade el SDK de
# Anthropic para escribir las fichas.
dependencies = [
    "anthropic>=1.15.0",
]

[project.scripts]
orakulue = "orakulue.interfaz.linea_ordenes:principal"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orakulue"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
